name: Shared Nix CI pilot

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shared-nix-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shared-nix:
    uses: hackelia-micrantha/.github/.github/workflows/reusable-nix-ci.yml@e618ec87afb963cf17be1acf68a8f4553ad3d506
    with:
      command: nix flake check --no-build --print-build-logs
      runner: ubuntu-latest
      working-directory: .
