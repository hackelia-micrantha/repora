name: deep-validation

on:
  pull_request:
    paths:
      - '.github/workflows/deep-validation.yml'
      - 'Makefile'
      - 'scripts/ci/repeat-tests.sh'
      - 'docs/ci.md'
  schedule:
    - cron: '17 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.13'

jobs:
  repeated-fast-tests:
    name: Repeated fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Repeat race-enabled fast tests
        env:
          REPEAT_COUNT: '10'
        run: make deep-repeat

  full-integration-race:
    name: Full integration race tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure disposable Git identity
        run: |
          git config --global user.name 'Repora Deep CI'
          git config --global user.email 'repora-deep-ci@example.invalid'

      - name: Run all race-enabled tests
        run: make deep-integration

  go-compatibility:
    name: Go compatibility (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.22.x'
          - '1.25.13'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Configure disposable Git identity
        run: |
          git config --global user.name 'Repora Compatibility CI'
          git config --global user.email 'repora-compat-ci@example.invalid'

      - name: Run portable validation contract
        run: make check
