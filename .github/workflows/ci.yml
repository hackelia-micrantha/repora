name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: |
          find . -name '*.go' -not -path './.git/*' -exec gofmt -l {} + | tee formatting-files.txt
          test ! -s formatting-files.txt

      - name: Upload formatting diagnostics
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: formatting-files
          path: formatting-files.txt

      - name: Fail on formatting
        if: steps.formatting.outcome == 'failure'
        run: exit 1

      - name: Vet
        run: |
          go vet ./...

      - name: Test
        run: |
          go test ./...

      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=amd64 go build ./...
