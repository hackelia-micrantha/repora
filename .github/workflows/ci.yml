name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Format main
        run: gofmt -w cmd/repoctl/main.go

      - name: Upload formatted main
        uses: actions/upload-artifact@v4
        with:
          name: formatted-main
          path: cmd/repoctl/main.go
