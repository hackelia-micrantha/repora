name: release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-tag.yml
      - CHANGELOG.md
      - Makefile
      - cmd/repoctl/main.go
      - cmd/repoctl/version.go
      - scripts/ci/cli-smoke.sh
      - scripts/release/**
      - docs/benchmarks.md
      - docs/release-checklist.md
      - docs/release.md
      - README.md
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Existing immutable tag to publish; leave empty for validation-only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.25.13'

jobs:
  validate:
    name: Validate release packages
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.publish_tag == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set validation metadata
        run: |
          {
            echo 'VERSION=v0.0.0-validation'
            echo "COMMIT=$GITHUB_SHA"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")"
          } >> "$GITHUB_ENV"

      - name: Build release packages
        run: make release-package

      - name: Verify reproducible checksums
        run: |
          cp dist/checksums.txt "$RUNNER_TEMP/checksums.first.txt"
          make release-package
          diff -u "$RUNNER_TEMP/checksums.first.txt" dist/checksums.txt

      - name: Verify release packages
        run: make release-verify

  publish:
    name: Publish tagged release
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tag || github.ref }}
          fetch-depth: 0

      - name: Require immutable tag commit on main
        env:
          DISPATCH_TAG: ${{ inputs.publish_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$DISPATCH_TAG"
          else
            VERSION="$GITHUB_REF_NAME"
          fi

          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "release tag is not present in the checkout: $VERSION" >&2
            exit 1
          fi

          TAG_SHA="$(git rev-parse "refs/tags/$VERSION^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
            echo "checked-out source does not match $VERSION" >&2
            exit 1
          fi

          CHANGELOG_VERSION="${VERSION#v}"
          if ! grep -Eq "^## \[${CHANGELOG_VERSION}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a dated ${CHANGELOG_VERSION} release heading" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG_SHA" origin/main

          {
            echo "VERSION=$VERSION"
            echo "COMMIT=$TAG_SHA"
            echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$TAG_SHA")"
          } >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build release packages
        run: make release-package

      - name: Verify release packages
        run: make release-verify

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/* \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes
