version: 1
kind: document-route-manifest
owner: routing

routes:
  - id: summary-architecture
    class: architecture
    priority: 110
    when:
      any_of:
        - architecture
        - design
        - planner
        - executor
        - reconciliation
        - mirror semantics
    trust_include:
      - generated
    include:
      - docs/architecture/SUMMARY.md
    exclude: []
    budget:
      max_files: 1
      max_bytes: 12000
      max_tokens_hint: 1200

  - id: source-plan-go
    class: architecture
    priority: 100
    when:
      any_of:
        - planner
        - reconcile
        - reconciliation plan
        - Reconcile
        - ReconciliationPlan
    source_selectors:
      language: go
      packages:
        - internal/plan
      symbols:
        - Reconcile
        - ReconciliationPlan
    include:
      - internal/plan/**
    exclude:
      - internal/plan/*_test.go
    budget:
      max_files: 4
      max_bytes: 50000
      max_tokens_hint: 5000

  - id: source-repoctl-command
    class: architecture
    priority: 100
    when:
      any_of:
        - repoctl command
        - command entrypoint
        - cli entrypoint
    source_selectors:
      language: go
      commands:
        - repoctl
      files:
        - cmd/repoctl/*.go
    include:
      - cmd/repoctl/**
    exclude:
      - cmd/repoctl/*_test.go
    budget:
      max_files: 4
      max_bytes: 50000
      max_tokens_hint: 5000

  - id: summary-schema
    class: config
    priority: 110
    when:
      any_of:
        - config
        - configuration
        - schema
        - spec
        - yaml
        - json
    trust_include:
      - generated
    include:
      - schemas/SUMMARY.md
    exclude: []
    budget:
      max_files: 1
      max_bytes: 12000
      max_tokens_hint: 1200

  - id: summary-routing
    class: prompts
    priority: 110
    when:
      any_of:
        - routing
        - document router
        - context router
        - trust tier
        - context receipt
        - token usage
    trust_include:
      - generated
    include:
      - docs/routing/SUMMARY.md
    exclude: []
    budget:
      max_files: 1
      max_bytes: 12000
      max_tokens_hint: 1200

  - id: summary-docs
    class: overview
    priority: 105
    when:
      any_of:
        - documentation
        - docs
        - summary
        - overview
    trust_include:
      - generated
    include:
      - docs/SUMMARY.md
    exclude: []
    budget:
      max_files: 1
      max_bytes: 12000
      max_tokens_hint: 1200

  - id: prompts-and-routing
    class: prompts
    priority: 95
    when:
      any_of:
        - prompt
        - prompt overlay
        - system prompt
        - routing
        - document router
        - context router
        - token usage
    include:
      - prompts/**
      - .repora/document-router.yaml
      - docs/routing/**
      - README.md
    exclude:
      - tests/**
    budget:
      max_files: 8
      max_bytes: 90000
      max_tokens_hint: 9000
