# Curated hackelia-micrantha topology example.
#
# Replace "replace-with-gitlab-namespace" before running repoctl. The GitHub
# mirror paths were inventoried from the organization on 2026-08-24.
#
# mode and policy are omitted intentionally. repoctl normalizes them to:
#   mode: mirror
#   policy.refs: {version: 1, scope: default-branch-only, destructive: require-force}
repos:
  - id: achillea
    uid: repo.hackelia-micrantha.achillea
    canonical:
      provider: gitlab
      path: replace-with-gitlab-namespace/achillea
    mirrors:
      - provider: github
        path: hackelia-micrantha/achillea
